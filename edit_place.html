{% extends 'base.html' %}
{% block content %}
<meta name="google" content="notranslate">
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200 relative">
    
    <a href="/" class="absolute top-4 right-4 text-xs font-bold text-slate-500 hover:text-red-600 bg-slate-100 px-3 py-1 rounded border transition">
        <i class="fa-solid fa-arrow-left"></i> Back / Cancel
    </a>

    <h2 class="text-lg font-black text-amber-700 mb-5 flex items-center gap-2 border-b pb-2">
        <i class="fa-solid fa-pen-to-square"></i> Full Edit Destination Specifications Form
    </h2>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Contributor Username:</label>
            <input type="text" disabled value="{{ place.added_by }}" class="w-full border rounded-lg p-2 text-sm bg-slate-100 cursor-not-allowed text-slate-500">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Category:</label>
            <input type="text" disabled value="{{ place.category }}" class="w-full border rounded-lg p-2 text-sm bg-slate-100 cursor-not-allowed text-slate-500">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Location Name (Title) *:</label>
            <input type="text" name="title" value="{{ place.title }}" required class="w-full border rounded-lg p-2 text-sm bg-slate-50">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Exact Location / Address *:</label>
            <input type="text" name="exact_location" value="{{ place.exact_location }}" required class="w-full border rounded-lg p-2 text-sm bg-slate-50">
        </div>

        <!-- Geographic Matrix Block -->
        <!-- Geographic Matrix Block -->
<div class="p-4 rounded-xl border border-amber-200 bg-amber-50/30 space-y-3">
    <h4 class="text-xs font-bold text-amber-800 uppercase tracking-wide">Geographic Matrix Modification</h4>
    <div class="grid grid-cols-2 gap-3">
        <div>
            <label class="block text-[11px] font-bold text-slate-500">Country *:</label>
            <select name="country" id="editCountrySelect" class="w-full border rounded-md p-2 text-xs bg-white">
                <option value="{{ place.country }}">{{ place.country }}</option>
            </select>
        </div>
        <div>
            <label class="block text-[11px] font-bold text-slate-500">State *:</label>
            <select name="state" id="editStateSelect" class="w-full border rounded-md p-2 text-xs bg-white">
                <option value="{{ place.state }}">{{ place.state }}</option>
            </select>
        </div>
        <div>
            <label class="block text-[11px] font-bold text-slate-500">District / City:</label>
            <select name="district" id="editCitySelect" class="w-full border rounded-md p-2 text-xs bg-white">
                <option value="{{ place.district }}">{{ place.district }}</option>
            </select>
        </div>
        <div>
            <label class="block text-[11px] font-bold text-slate-500">Village / Specific Area:</label>
            <input type="text" name="city" value="{{ place.village_city }}" placeholder="Enter village or area" class="w-full border rounded-md p-2 text-xs bg-white">
        </div>
    </div>
</div>

<script>
    const editCountrySelect = document.getElementById('editCountrySelect');
    const editStateSelect = document.getElementById('editStateSelect');
    const editCitySelect = document.getElementById('editCitySelect');

    const currentCountry = "{{ place.country }}";
    const currentState = "{{ place.state }}";
    const currentDistrict = "{{ place.district }}";

    // બધા દેશો લોડ કરો
    fetch('https://countriesnow.space/api/v0.1/countries')
        .then(res => res.json())
        .then(data => {
            editCountrySelect.innerHTML = '<option value="">Select Country</option>';
            data.data.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c.country;
                opt.textContent = c.country;
                if (c.country === currentCountry) opt.selected = true;
                editCountrySelect.appendChild(opt);
            });
            if(currentCountry) loadStatesForEdit(currentCountry);
        });

    function loadStatesForEdit(countryName) {
        fetch('https://countriesnow.space/api/v0.1/countries/states', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ country: countryName })
        })
        .then(res => res.json())
        .then(data => {
            editStateSelect.innerHTML = '<option value="">Select State</option>';
            if (!data.error && data.data.states) {
                data.data.states.forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s.name;
                    opt.textContent = s.name;
                    if (s.name === currentState) opt.selected = true;
                    editStateSelect.appendChild(opt);
                });
            }
        });

        fetch('https://countriesnow.space/api/v0.1/countries/cities', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ country: countryName })
        })
        .then(res => res.json())
        .then(data => {
            editCitySelect.innerHTML = '<option value="">Select District/City</option>';
            if (!data.error && data.data) {
                data.data.forEach(city => {
                    let opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    if (city === currentDistrict) opt.selected = true;
                    editCitySelect.appendChild(opt);
                });
            }
        });
    }

    editCountrySelect.addEventListener('change', function() {
        loadStatesForEdit(this.value);
    });
</script>

        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Food & Stay Arrangements:</label>
            <textarea name="food_stay" rows="2" class="w-full border rounded-lg p-2 text-sm bg-slate-50">{{ place.food_stay }}</textarea>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">How to Reach (Vehicles/Transport):</label>
            <textarea name="transport" rows="2" class="w-full border rounded-lg p-2 text-sm bg-slate-50">{{ place.transport }}</textarea>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Description Paragraph *:</label>
            <textarea name="description" rows="4" required class="w-full border rounded-lg p-2 text-sm bg-slate-50">{{ place.description }}</textarea>
        </div>

        <!-- 🟢 મલ્ટીપલ ફોટા અને ઓડિયો અપડેટ/બદલવા માટેના ફિલ્ડ્સ -->
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
            <label class="block text-xs font-bold text-slate-700"><i class="fa-solid fa-photo-film mr-1"></i> Update Photos / Media Files:</label>
            <input type="file" name="photos" multiple accept="image/*,video/*,audio/*" class="w-full text-xs border rounded-lg p-2 bg-white">
            <p class="text-[11px] text-slate-500">તમે નવા ફોટા અથવા ઓડિયો/વિડિયો સિલેક્ટ કરશો એટલે જૂના ફાઇલોની સાથે આ પણ જોડાઈ જશે.</p>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-2">
            <a href="/" class="bg-slate-600 text-white font-bold p-2.5 rounded-lg text-sm text-center shadow">Cancel</a>
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-bold p-2.5 rounded-lg text-sm shadow transition">
                💾 Update Master Record
            </button>
        </div>
    </form>

    <!-- 🗑️ ડીલીટ બટન -->
    <div class="mt-6 pt-6 border-t border-slate-200">
         <form action="/admin/delete_place/{{ place.id }}" method="POST" 
              onsubmit="return confirm('Warning: Do you want to delete this place forever?');">
              <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-2.5 rounded-lg text-sm shadow transition">
                    🗑️ Delete This Destination
              </button>
         </form>
    </div>

</div>
{% endblock %}
