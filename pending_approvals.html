<!DOCTYPE html>
<html lang="gu"><head><title>Pending Approvals</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<meta name="google" content="notranslate">
</head>
<body class="bg-light p-5"><div class="container bg-white p-4 rounded shadow">
    <h4 class="mb-4">📢 Pending Approvals List</h4>
    <table class="table table-bordered"><thead><tr><th>Title</th><th>Description</th><th>Action</th></tr></thead><tbody>
    {% for place in places %}<tr><td>{{ place.title }}</td><td>{{ place.description }}</td>
    <td><a href="/approve-place/{{ place.id }}" class="btn btn-sm btn-success fw-bold">Approve ✔️</a></td></tr>
    {% else %}<tr><td colspan="3" class="text-center text-muted">કોઈ પેન્ડિંગ રિકવેસ્ટ નથી.</td></tr>{% endfor %}
    </tbody></table><a href="/" class="btn btn-secondary btn-sm">🔙 Back</a>
</div></body></html>
