<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <title>Update Place Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .top-bar { background-color: #0f766e; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; color: white; }
        .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .edit-preview-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="bg-light">
    <div class="top-bar">
        <div class="d-flex align-items-center">
            <img src="/static/logo.png" width="55" height="55" class="me-3" onerror="this.src='https://via.placeholder.com/55?text=LOGO'">
            <h1 class="m-0 h4 fw-bold">✏️ Update Information</h1>
        </div>
        <a href="/edit-place" class="btn btn-light fw-bold">🔙 Back</a>
    </div>
    <div class="container text-start">
        <div class="form-container">
            <label class="form-label fw-bold text-muted">Current Place Image:</label>
            <img src="/static/{{ place.clean_image_path }}" class="edit-preview-img" onerror="this.src='https://via.placeholder.com/600x250?text=No+Image'">
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Place Name (જગ્યાનું નામ)</label>
                    <input type="text" name="title" class="form-control" value="{{ place.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Description (વર્ણન)</label>
                    <textarea name="description" class="form-control" rows="6" required>{{ place.description }}</textarea>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">🔄 Update & Save Now</button>
            </form>
        </div>
    </div>
</body>
</html>
