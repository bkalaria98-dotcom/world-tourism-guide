<!DOCTYPE html>
<html lang="gu">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <title>નવું એકાઉન્ટ બનાવો</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow">
            <h3 class="text-center text-success mb-3">📝 રજીસ્ટ્રેશન</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">યુઝરનેમ</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ઈમેઈલ આઈડી</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">પાસવર્ડ</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">એકાઉન્ટ બનાવો</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login">પહેલેથી એકાઉન્ટ છે? લોગીન કરો</a>
            </div>
        </div>
    </div>
</body>
</html>
