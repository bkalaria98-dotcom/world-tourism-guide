<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <title>Add Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .top-bar { background-color: #0f766e; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; color: white; }
        .form-container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-light">
    <div class="top-bar">
        <div class="d-flex align-items-center">
            <img src="/static/logo.png" width="55" height="55" class="me-3" onerror="this.src='https://via.placeholder.com/55?text=LOGO'">
            <h1 class="m-0 h4 fw-bold">🗂️ Add New Category</h1>
        </div>
        <a href="/" class="btn btn-light fw-bold">🏠 Home</a>
    </div>
    <div class="container">
        <div class="form-container">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Category Name (Gujarati)</label>
                    <input type="text" name="name_guj" class="form-control" placeholder="દા.ત. ઐતિહાસિક સ્થાનો" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">➕ Save Category</button>
            </form>
        </div>
    </div>
</body>
</html>
